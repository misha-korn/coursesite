# Конфиг nginx ВНУТРИ контейнера фронтенда.
# Он не смотрит наружу: к нему обращается только главный nginx проекта.
# Его единственная работа - отдавать собранную статику и знать про
# клиентскую маршрутизацию React.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки содержат хэш в имени (main-a3f9b2.js), поэтому при
    # изменении меняется имя. Значит их можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Маршруты вроде /catalog существуют только внутри React, файлов с такими
    # именами на диске нет. Не нашли файл - отдаём index.html, дальше
    # разбирается роутер в браузере.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
