services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment: {DJANGO_SETTINGS_MODULE: config.settings.prod}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build: .
    environment:
      COLLECTSTATIC: "1"
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    healthcheck:
      test: [ "CMD", "python", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  celery:
    build: .
    command: celery -A config worker -l info
    environment: {DJANGO_SETTINGS_MODULE: config.settings.prod}
    env_file: .env
    healthcheck:
      test: [ "CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  beat:
    build: .
    command: celery -A config beat -l info --schedule=/data/celerybeat-schedule
    volumes:
      - beat_data:/data
    environment: {DJANGO_SETTINGS_MODULE: config.settings.prod}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
#    ports:
#      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    command: ["/bin/sh", "-c", "/nginx-reload.sh & nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_params:/etc/nginx/proxy_params:ro
      - ./scripts/nginx-reload.sh:/nginx-reload.sh:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build: ./frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: 3
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    command: ["/bin/sh", "/renew.sh"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./scripts/renew.sh:/renew.sh:ro
    restart: unless-stopped

volumes:
  pg_data:
  static_volume:
  media_volume:
  certbot_conf:
  certbot_www:
  rabbitmq_data:
  beat_data: